
name: Test RDGen via NetBird

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rdgen:
    name: Test accesso privato RDGen
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Connetti NetBird
        uses: ankurk91/netbird-action@v2
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          management-url: ${{ vars.NETBIRD_MANAGEMENT_URL }}
          peer-name: rdgen-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Diagnostica connessione RDGen
        env:
          GENURL: ${{ secrets.GENURL }}
        shell: bash
        run: |
          set -u

          if [ -z "$GENURL" ]; then
            echo "ERRORE: GENURL mancante"
            exit 1
          fi

          HOST=$(echo "$GENURL" | sed -E 's#^https?://([^:/]+).*#\1#')

          echo "=== VERIFICA PEER NETBIRD ==="
          if netbird status --detail | grep -Fq "NetBird IP: $HOST"; then
            echo "Peer RDGen PRESENTE"
          else
            echo "Peer RDGen NON PRESENTE"
          fi

          echo "=== VERIFICA ROTTA ==="
          ip -4 route get "$HOST" || true

          echo "=== TEST TCP RDGEN ==="
          for i in 1 2 3 4 5 6; do
            echo "Tentativo $i"

            if curl --noproxy '*' \
              --connect-timeout 5 \
              --max-time 10 \
              -fsS -o /dev/null \
              -w 'RDGen HTTP: %{http_code}\n' \
              "$GENURL/"; then
              echo "CONNESSIONE RIUSCITA"
              exit 0
            fi

            sleep 5
          done

          echo "ERRORE: RDGen non raggiungibile"
          exit 1
